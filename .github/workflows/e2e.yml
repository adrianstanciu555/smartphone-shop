name: E2E

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/e2e/**"
      - "database/**"
      - "docs/products-seed.csv"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "tests/e2e/**"
      - "database/**"
      - "docs/products-seed.csv"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartphone_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the ephemeral CI database; not used anywhere else.
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartphone_shop
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      ENABLE_TEST_RESET: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Type-check E2E framework
        working-directory: tests/e2e
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the frontend, starts it on :3100 and resets the database.
      - name: Run E2E tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload traces and videos of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 14
